# Archipelago support for Goemon's Great Adventure: Recompiled.

[manifest]
id = "gga_recomp_rando"
version = "0.0.1"
display_name = "GGARecompRando"
description = """
Archipelago multiworld support for Goemon's Great Adventure.

https://github.com/StopSine/GGARecompRando"""
short_description = "Archipelago multiworld"
authors = [ "StopSine" ]

game_id = "gga"
minimum_recomp_version = "0.2.0"

native_libraries = [
    { name = "APCpp-Glue", funcs = [
        "rando_init",
        "rando_is_connected",
        "rando_connect_failed",
        "rando_get_items_size",
        "rando_get_item",
        "rando_get_sending_player",
        "rando_get_item_name_from_id",
        "rando_get_sending_player_name",
        "rando_send_location",
        "rando_get_location_item_name",
        "rando_get_location_item_player",
        "rando_get_location_type",
        "rando_queue_scouts_all",
        "rando_send_queued_scouts",
        "rando_is_scouted",
        "rando_location_is_checked",
        "rando_has_item",
        "rando_get_own_slot_name",
        "rando_get_seed_name",
        "rando_complete_goal",
        "rando_get_death_link_enabled",
        "rando_get_death_link_pending",
        "rando_reset_death_link_pending",
        "rando_send_death_link",
    ] }
]

# The mod cannot write its own config, so these are what makes a connection
# persist between runs: set them once here and the connect menu starts filled in.
[[manifest.config_options]]
id = "server_address"
name = "Server Address"
description = "Prefills the connect menu. Host and port, for example archipelago.gg:38281"
type = "String"
default = "archipelago.gg:38281"

[[manifest.config_options]]
id = "slot_name"
name = "Slot Name"
description = "Prefills the connect menu with your slot name."
type = "String"
default = ""

[[manifest.config_options]]
id = "death_link"
name = "Death Link"
description = "Send and receive deaths. Only has an effect when the slot was generated with death link on."
type = "Enum"
options = [ "Disabled", "Enabled" ]
default = "Enabled"

[inputs]
elf_path = "build/mod.elf"
mod_filename = "gga_recomp_rando"

func_reference_syms_file = "../Goemon64Recomp/lib/gga/config/usa/gga.elf.syms.toml"
data_reference_syms_files = [ "../Goemon64Recomp/lib/gga/config/usa/gga.elf.datasyms.toml" ]
